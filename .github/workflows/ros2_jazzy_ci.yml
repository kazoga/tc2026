name: ROS 2 Jazzy CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy --as-root pip:false --skip-keys 'ament_python python3-japanize-matplotlib' -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      # robot_console/tools/tests は全テストを pytest-forked で子プロセスへ隔離する。
      # fork() は呼び出しスレッドだけを複製するため、同じ pytest プロセスで先に
      # 実行されたテストがスレッドを残していると、子プロセスがそのロックを引き継いで
      # デッドロックする。実行を分けて、他パッケージの状態を持ち込まない。
      # --ignore は pytest.ini の testpaths に明示されたディレクトリには効かないため、
      # --ignore-glob を使う。
      - name: Run pytest (robot_console 以外)
        shell: bash
        timeout-minutes: 15
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          pytest -q --ignore-glob="*robot_console/tools/tests*"

      - name: Run pytest (robot_console)
        shell: bash
        timeout-minutes: 15
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          pytest -q src/robot_console/tools/tests
