name: ROS 2 Jazzy CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Install ROS dependencies
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy --as-root pip:false --skip-keys 'ament_python python3-japanize-matplotlib' -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      # fork() は呼び出しスレッドだけを複製するため、先に実行されたテストがスレッドを
      # 残していると、子プロセスがそのロックを引き継いでデッドロックする。現在 fork するのは
      # robot_console/tools/tests/isolated だけで、それも test_isolated_suite.py が起こす
      # 専用の子プロセスから行うため、分割しなくても停止しない。将来 tools/tests 直下へ
      # forked テストが追加された場合に影響を 1 段目へ波及させないよう、実行は分けておく。
      # --ignore は pytest.ini の testpaths に明示されたディレクトリには効かないため、
      # --ignore-glob を使う。
      - name: Run pytest (robot_console 以外)
        shell: bash
        timeout-minutes: 15
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          pytest -q --ignore-glob="*robot_console/tools/tests*"

      - name: Run pytest (robot_console)
        shell: bash
        timeout-minutes: 15
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          pytest -q src/robot_console/tools/tests
