    label: 稲城近郊候補・Tokyo 6C10214A
    host: ntrip1.bizstation.jp
    port: 2101
    mountpoint: 6C10214A
    latitude: 35.74
    longitude: 139.47
    coordinate_reference: Current（caster表示。元期座標の経路との整合確認が必要）
