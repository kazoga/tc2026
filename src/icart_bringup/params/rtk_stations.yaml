# 運転中の自動切替はしない。停止・再起動して選択する。
# availableは恒久保証ではない。check_rtk_stationで当日のRTCM受信を検査する。
checked_date: '2026-09-20'
sources:
  - https://rtk.silentsystem.jp/
  - http://ntrip1.bizstation.jp:2101/
sites:
  inagi:
    default_station: tokyo_6c10214a
    stations: [tokyo_6c10214a, tokyo_c4cae992, none, custom]
  tsukuba:
    default_station: tsukuba_takashima
    stations: [tsukuba_takashima, joso_yasuda, none, custom]
stations:
