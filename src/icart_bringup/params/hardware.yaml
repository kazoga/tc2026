# tc2025 joystick launchを基準にする。実測値で上書き可能。
# 車軸中央 x=0 は2026-09-20ユーザー確認済み。高さ1.005mは昨年度の公称値。
# xyz: base_link（車軸中心）からのm、rpy: 度。x前、y左、z上。
mid360:
  xyz: [0.0, 0.0, 1.005]
  rpy_deg: [0.0, 25.0, 0.0]
  # xyzはMID-360 LiDAR原点の公称値。取付後の実測が必要。
  host_ip: 192.168.1.5
  lidar_ip: 192.168.1.12
  # 工場LiDAR→IMU較正。車体への25度傾斜はここへ加えない。
  lidar_in_imu_xyz: [-0.011, -0.02329, 0.04412]
gnss:
  serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
  baud: 115200
  master_above_lidar_m: 0.1
  slave_behind_master_m: 0.5
  heading_offset_deg: 180.0
  time_sync_enabled: false
urg:
  serial_port: /dev/serial/by-id/usb-Hokuyo_Data_Flex_for_USB_URG-Series_USB_Driver-if00
  baud: 115200
  xyz: [0.075, 0.0, 0.49]
  rpy_deg: [0.0, 0.0, 0.0]
  angle_min: -2.0
  angle_max: 2.0
wheel:
  serial_port: /dev/serial/by-id/usb-T-frog_project_T-frog_Driver-if00
  coordinator_param: /home/nkb/icart-middle.param
camera:
  enabled: true
  device: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_B8DE396F-video-index0
  width: 640
  height: 480
  framerate: 5.0
  pixel_format: yuyv
joy:
  device_id: 0
  device_name: 'Sony PLAYSTATION(R)3 Controller'
  linear_axis: 1
  angular_axis: 0
  enable_button: 4
  # 現PCのSDL割り当て: L1=4、PS=10（16は十字キー右）。
  ps_button: 10
  linear_scale: 1.2
  angular_scale: 1.5
